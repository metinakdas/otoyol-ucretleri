<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
  <title>Otoyol Ücretleri</title>
  <meta name="description" content="Otoyol gişeleri arası geçiş ücreti hesaplama, köprü ücretleri ve bayramda ücretsiz geçiş kararları">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M11 25 14.5 7h3L21 25' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M16 10.5v2.5M16 15.5v2.5M16 20.5v2.5' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <a class="logo" href="./" aria-label="Otoyol Ücretleri, ana sayfa">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="logo-bg"/><path d="M11 25 14.5 7h3L21 25" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><path d="M16 10.5v2.5M16 15.5v2.5M16 20.5v2.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Otoyol Ücretleri</span>
    </a>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </header>

  <div class="app" id="app">
    <div class="map-area">
      <div id="map" class="map" aria-label="Otoyol gişeleri ve köprüler haritası"></div>
      <button type="button" id="notice" class="notice" hidden></button>
    </div>

    <aside class="panel" aria-label="Ücret hesabı ve bilgiler">
      <div id="sample-note" class="sample-note" hidden>Örnek veri ile önizleme</div>
      <nav class="tabs" role="tablist" aria-label="Bölümler">
        <button type="button" role="tab" id="tab-btn-rota" aria-controls="tab-rota" aria-selected="true">Rota</button>
        <button type="button" role="tab" id="tab-btn-kopru" aria-controls="tab-kopru" aria-selected="false" tabindex="-1">Köprüler</button>
        <button type="button" role="tab" id="tab-btn-duyuru" aria-controls="tab-duyuru" aria-selected="false" tabindex="-1">Duyurular<span class="badge" id="duyuru-badge" hidden></span></button>
      </nav>

      <section class="tab-panel" id="tab-rota" role="tabpanel" aria-labelledby="tab-btn-rota">
        <form class="route" id="trip" autocomplete="off" novalidate>
          <div class="route-fields">
            <span class="route-rail" aria-hidden="true"><i class="dot dot-in"></i><i class="rail"></i><i class="dot dot-out"></i></span>
            <div class="combo">
              <label class="visually-hidden" for="trip-giris">Giriş gişesi</label>
              <input id="trip-giris" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
                     aria-controls="trip-giris-list" placeholder="Giriş gişesi" spellcheck="false">
              <ul class="combo-list" id="trip-giris-list" role="listbox" hidden></ul>
            </div>
            <div class="combo">
              <label class="visually-hidden" for="trip-cikis">Çıkış gişesi</label>
              <input id="trip-cikis" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
                     aria-controls="trip-cikis-list" placeholder="Çıkış gişesi" spellcheck="false">
              <ul class="combo-list" id="trip-cikis-list" role="listbox" hidden></ul>
            </div>
            <button type="button" class="icon-btn swap" id="trip-swap" title="Yönü değiştir" aria-label="Giriş ve çıkışı değiştir">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4v12M7 16l-3-3M7 16l3-3M13 16V4M13 4l-3 3M13 4l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <fieldset class="vehicles">
            <legend>Araç sınıfı</legend>
            <div class="vehicle-grid" id="trip-classes"></div>
          </fieldset>
        </form>
        <div id="trip-result" class="result" aria-live="polite"></div>
      </section>

      <section class="tab-panel" id="tab-kopru" role="tabpanel" aria-labelledby="tab-btn-kopru" hidden>
        <div class="section-head">
          <h2>Köprü ve tüneller</h2>
          <span class="muted small" id="kopru-sinif"></span>
        </div>
        <ul class="crossings" id="crossings"></ul>
      </section>

      <section class="tab-panel" id="tab-duyuru" role="tabpanel" aria-labelledby="tab-btn-duyuru" hidden>
        <div id="announcements"></div>
        <div class="section-head"><h2>Bayramda ücretsiz geçiş</h2></div>
        <div id="free" class="free"></div>
        <div class="section-head" id="events-head"><h2>Son kayıtlar</h2></div>
        <ul id="events" class="events"></ul>
        <details class="disclosure">
          <summary>Kaynaklar <span class="muted" id="source-summary"></span></summary>
          <ul id="sources" class="sources"></ul>
        </details>
        <details class="disclosure">
          <summary>KGM tarife belgeleri <span class="muted" id="doc-count"></span></summary>
          <ul id="documents" class="documents"></ul>
        </details>
        <p class="footnote" id="footer"></p>
      </section>
    </aside>
  </div>

  <template id="error-tpl">
    <div class="error-box">
      <h2>Veri okunamadı</h2>
      <p>Radar henüz çalışmamış olabilir. Yerelde denemek için <code>python -m radar panel --ornek</code>.</p>
    </div>
  </template>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="harita.js"></script>
  <script src="hesap.js"></script>
  <script src="app.js"></script>
</body>
</html>
