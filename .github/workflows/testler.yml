name: Testler

on:
  push:
    paths-ignore:
      - "data/**"
  pull_request: {}

# Testler yalnızca okuma yetkisiyle çalışır ve hiçbir gizli bilgiye erişmez.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
