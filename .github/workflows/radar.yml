name: Tarife Radarı

on:
  schedule:
    # Yedek zamanlama. GitHub bunu yoğunlukta seyreltir (gerçekte günde 3-4 tur); asıl 30 dakikalık
    # tetikleme dış zamanlayıcıdan (tetikleyici/, Cloudflare Workers) workflow_dispatch ile gelir.
    - cron: "*/30 * * * *"
  workflow_dispatch:         # Actions sekmesinden elle ya da dış zamanlayıcıdan çalıştırmak için
    inputs:
      tetik:
        description: "Turu başlatan (elle çalıştırmada değiştirmeyin)"
        type: choice
        options: [elle, zamanlayici]
        default: elle

# Güvenlik: varsayılan olarak hiçbir yetki verilmez; her iş yalnızca ihtiyacı olanı alır.
permissions: {}

concurrency:
  group: tarife-radari
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write     # yalnızca data/ klasörünü kaydetmek için
    outputs:
      hazir: ${{ steps.ayar.outputs.hazir }}
      changed: ${{ steps.kaydet.outputs.changed }}
    steps:
      # Bildirim kanalı tanımlanmadan çalışırsa bildirimler "gönderildi" sayılıp kaybolur; bu yüzden beklenir.
      - name: Bildirim ayarlarını denetle
        id: ayar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          if { [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; } || { [ -n "$SMTP_HOST" ] && [ -n "$EMAIL_TO" ]; } \
             || { [ -n "$WHATSAPP_TOKEN" ] && [ -n "$WHATSAPP_PHONE_NUMBER_ID" ] && [ -n "$WHATSAPP_TO" ]; }; then
            echo "hazir=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Bildirim kanalı tanımlı değil (Settings > Secrets and variables > Actions). Radar ayarlar girilene kadar çalışmaz."
            echo "hazir=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: steps.ayar.outputs.hazir == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.ayar.outputs.hazir == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        if: steps.ayar.outputs.hazir == 'true'
        # tzdata bilerek en son sürüme yükseltilir: saat dilimi izleme yeni IANA sürümünü buradan görür.
        # Diğer tüm paketler hash ile doğrulanır; tzdata bilinçli istisnadır (yalnızca veri içerir,
        # Python çekirdek ekibince yayımlanır).
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --upgrade tzdata

      - name: Radar turu
        if: steps.ayar.outputs.hazir == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TECH_CHAT_ID: ${{ secrets.TELEGRAM_TECH_CHAT_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
          WHATSAPP_TEMPLATE_LANG: ${{ secrets.WHATSAPP_TEMPLATE_LANG }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PANEL_URL: ${{ vars.PANEL_URL }}
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_USER: ${{ secrets.LOKI_USER }}
          LOKI_TOKEN: ${{ secrets.LOKI_TOKEN }}
          RADAR_TETIK: ${{ inputs.tetik || github.event_name }}
        run: python -m radar calistir

      - name: Değişiklikleri kaydet
        id: kaydet
        if: steps.ayar.outputs.hazir == 'true'
        run: |
          git config user.name "tarife-radari[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "radar: veri güncellemesi"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Paneli GitHub Pages'e yayımlar. Yalnızca panel dosyaları ile panel.json ve ucret-tablosu.json yayımlanır.
  # Veri değişmediyse yalnızca elle çalıştırmada yayımlanır; dış zamanlayıcı her turda yayın açmaz.
  panel:
    needs: radar
    if: >-
      needs.radar.outputs.changed == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.tetik != 'zamanlayici' && needs.radar.outputs.hazir == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.ref_name }}   # radar işinin az önce kaydettiği son veriyi al
          persist-credentials: false

      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site/data
          cp -r panel/. _site/
          rm -f _site/ornek-*.json
          for f in panel.json ucret-tablosu.json saat-dilimleri.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "_site/data/$f"; fi
          done

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site

      - id: yayin
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
