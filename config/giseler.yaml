# Serbest geçiş (SGS) noktaları
#
# KGM tarifelerinin bazılarında ana tablodan ayrı, sabit ücretli "Serbest Geçiş Sistemi Alanı" satırları
# vardır (13 YSS ve Kuzey Çevre, 14 KMO Kınalı–Odayeri, 15 KMO Kurtköy–Akyazı). Her öğe bir fiziksel
# serbest geçiş noktasıdır; "satirlar" o noktanın tarifedeki satır adlarıdır (iki yönün A/B satırı ya da
# aynı adla iki yön). "satirlar" yazılmazsa satır adı öğenin adıdır. Kayıtta olmayan satır haritada
# görünmez ve teknik gruba bir kez "GİŞE KAYDI EKSİK" olarak bildirilir.
#
# Kasım 2026'da bir kez belirlendi (kaynak: OpenStreetMap katkıcıları, ODbL; highway=toll_gantry
# noktaları). Her nokta yolun yönü ve iki yanındaki kavşaklarla denetlendi; A/B gişeleri birkaç yüz metre
# arayla durduğundan iki yönün ortası alındı. Adı OSM'de yazmayan ya da yanlış yazan noktalar "not"ta belirtilir.
