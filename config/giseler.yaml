# =====================================================================================================
# Tablolar arası bağlantılar
#
# Farklı tarife tablolarının, sürücünün otoyoldan çıkmadan bir sistemden ötekine geçtiği gişe çiftleri.
# Panel bunlarla tablolar arası yolculuğu hesaplar: a tablosunda girişten a gişesine + (varsa) aradaki
# serbest geçiş satırları + b tablosunda b gişesinden çıkışa. KGM belgelerinde aktarma indirimi ya da
# birleşik ücret yoktur; her işletme kendi tablosunun ücretini ayrı alır.
#
#   a, b        : {otoyol, ad}: tarifedeki istasyon adıyla
#   yol_km      : iki nokta arasındaki yol uzunluğu (yaklaşık; OSM yol ağıyla bir kez ölçüldü). Ara kesim
#                 ücretsizse (ör. şehir geçişi) bu uzunlukta ücret alınmaz.
#   tek_yon     : true ise yalnızca a'dan b'ye geçilir (yöne göre ayrı istasyonlu tablolar için)
#   ara_serbest : a→b (ab) ve b→a (ba) yönünde arada geçilen serbest geçiş satırları {otoyol, ad, yon}
#   not         : neden bağlantı olduğu
#
# Kasım 2026'da bir kez denetlendi: iki noktanın kayıttaki konumları, OSM yol ağında aradaki otoyol
# (motorway) bağlantısı ve yol üzerindeki bütün gişe/serbest geçiş noktaları. Aynı adlı ama farklı yerdeki
# gişeler bağlanmadı (Avrupa ve KMO'nun Silivri/Çatalca gişeleri; TEM Akyazı – KMO Akyazı arası D-140
# devlet yoludur). Doğrulanamayanlar eklenmedi (Gaziantep Batı – Gaziantep Doğu: OSM'de Gaziantep Batı
# gişesi ana hatta değil, kolda görünüyor; şehir çevre yolları üzerinden geçişler).
baglantilar:
  # --- İstanbul Anadolu yakası
  - a: {otoyol: yss-kuzey-cevre, ad: Kurnaköy}
    b: {otoyol: kmo-kurtkoy-akyazi, ad: Kurnaköy 2}
    yol_km: 2.7
    not: O-7 ana hattı; Kuzey Çevre'nin Kurnaköy gişesi ile KMO'nun Kurnaköy-2 gişesi arasında başka gişe yok.
  - a: {otoyol: anadolu-camlica-akinci, ad: Mecidiye}
    b: {otoyol: yss-kuzey-cevre, ad: Mecidiye}
    yol_km: 0.3
    not: O-4 ile O-7 arasındaki Mecidiye kavşak kolu; KGM'nin ve YSS'nin Mecidiye gişeleri aynı kolda arka arkaya.
  # --- İstanbul Avrupa yakası
  - a: {otoyol: kmo-kinali-odayeri, ad: Fatih}
    b: {otoyol: yss-kuzey-cevre, ad: Odayeri}
    yol_km: 9.0
    ara_serbest:
      ab: [{otoyol: kmo-kinali-odayeri, ad: 21 (Terminal A), yon: Kuzey - Güney}, {otoyol: kmo-kinali-odayeri, ad: 24 (Kargo A), yon: Kuzey - Güney}]
      ba: [{otoyol: kmo-kinali-odayeri, ad: 24 (Kargo B), yon: Güney - Kuzey}, {otoyol: kmo-kinali-odayeri, ad: 21 (Terminal B), yon: Güney - Kuzey}]
    not: O-7 ana hattı (havalimanı önü). KMO tablosu Fatih'te biter; Odayeri gişesi YSS tablosunun. Aradaki Terminal ve Kargo serbest geçiş noktaları ana hatta.
  - a: {otoyol: avrupa-mahmutbey-edirne, ad: Kınalı}
    b: {otoyol: kmo-kinali-odayeri, ad: Kınalı}
    yol_km: 4.2
    not: Kınalı kavşağı (O-3, O-6, O-7). Avrupa Otoyolu tarifesinde Kınalı ile Küçükılıçlı 0 km ve aynı ücretli.
  - a: {otoyol: avrupa-mahmutbey-edirne, ad: Mahmutbey}
    b: {otoyol: yss-kuzey-cevre, ad: Fenertepe}
    yol_km: 17.5
    ara_serbest:
      ab: [{otoyol: yss-kuzey-cevre, ad: İstoç, yon: Güney - Kuzey}, {otoyol: yss-kuzey-cevre, ad: İkitelli, yon: Güney - Kuzey}, {otoyol: yss-kuzey-cevre, ad: Başakşehir Güney, yon: Güney - Kuzey}, {otoyol: yss-kuzey-cevre, ad: Başakşehir, yon: Güney - Kuzey}, {otoyol: yss-kuzey-cevre, ad: Fenertepe, yon: Güney - Kuzey}]
      ba: [{otoyol: yss-kuzey-cevre, ad: Fenertepe, yon: Kuzey - Güney}, {otoyol: yss-kuzey-cevre, ad: Başakşehir, yon: Kuzey - Güney}, {otoyol: yss-kuzey-cevre, ad: Başakşehir Güney, yon: Kuzey - Güney}, {otoyol: yss-kuzey-cevre, ad: İstoç, yon: Kuzey - Güney}]
    not: O-3 Mahmutbey serbest geçiş noktası → Mahmutbey Batı kavşağı → O-7 güney kolu → Fenertepe gişesi. Kolda beş serbest geçiş noktası var (güneye giderken İkitelli'de gişe yok).
  # --- Kocaeli / Sakarya
  - a: {otoyol: anadolu-camlica-akinci, ad: Kartepe}
    b: {otoyol: kmo-kurtkoy-akyazi, ad: İzmit Doğu}
    yol_km: 2.7
    ara_serbest:
      ab: [{otoyol: kmo-kurtkoy-akyazi, ad: İzmit OSB B, yon: Güney - Kuzey}]
      ba: [{otoyol: kmo-kurtkoy-akyazi, ad: İzmit OSB A, yon: Kuzey - Güney}]
    not: TEM İzmit 1 kavşağı – KMO bağlantı yolu. KGM'nin Kartepe ve KMO'nun İzmit OSB serbest geçiş noktaları arka arkaya.
  - a: {otoyol: kmo-kurtkoy-akyazi, ad: TEM Akyazı}
    b: {otoyol: anadolu-camlica-akinci, ad: Topağaç}
    yol_km: 0.7
    not: KMO'nun doğu ucu. Bağlantı yalnızca TEM'in doğu (Hendek–Ankara) yönüne iner; TEM'in batısına (Adapazarı) buradan geçilmez.
  - a: {otoyol: anadolu-camlica-akinci, ad: Muallimköy}
    b: {otoyol: kmo-kurtkoy-akyazi, ad: Mermerciler}
