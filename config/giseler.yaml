# Gişe kaydı: otoyol gişelerinin konumları. BU DOSYA BİZİM VERİMİZDİR.
#
# Haritadaki otoyol gişeleri yalnızca buradan çizilir. Radar çalışırken hiçbir konum dışarıdan
# (OpenStreetMap, Overpass vb.) alınmaz; harita karoları yalnızca arka plandır. Böylece kapanmış ya da
# tarifede olmayan gişeler (ör. Derince, eski D-100 gişeleri) haritaya giremez.
#
# Yapı: otoyol kimliği (data/ucret-tablosu.json'daki "id") → gişeler, tarifedeki sırayla:
#
#   anadolu-camlica-akinci:
#     - ad: Adapazarı            # tarifedeki istasyon adıyla aynı yazılır
#       konum: [40.7133, 30.3846] # [enlem, boylam]; bilinmiyorsa null (haritaya konmaz, hesapta seçilir)
#       il: Sakarya              # il adı; bölge buradan bulunur
#       not: ...                 # isteğe bağlı açıklama
#       serbest: true            # isteğe bağlı: istasyon bir serbest geçiş (SGS) noktasıdır
#
# Dosyanın sonunda iki bölüm daha var (ayrıntı başlıklarında):
#   serbest_gecis: tarifelerin sabit ücretli serbest geçiş (SGS) satırlarının noktaları
#   baglantilar  : farklı tarife tabloları arasında otoyoldan çıkmadan geçilen gişe çiftleri
#
# Eşleşme otoyol kimliği + istasyon adıyla yapılır; büyük/küçük harf ve Türkçe harf farkı (ı/i, ş/s…)
# önemsizdir, ama başka bir yazım (ör. "Adapazari Gişeleri") eşleşmez.
#
# Ekleme / düzeltme:
#   1. KGM tarifesine yeni bir gişe girerse radar teknik gruba "gişe kaydı eksik" uyarısı gönderir
#      (her gişe için bir kez) ve "python -m radar ucret-tablosu" çıktısında listeler. O gişe tabloda
#      kalır ama haritada görünmez.
#   2. Gişeyi ilgili otoyolun listesine, tarifedeki adıyla ekleyin. Konumu gişe binasının (ya da serbest
#      geçiş noktasının) üzerinden alın; emin değilseniz konum: null bırakın. Yanlış nokta, eksik
#      noktadan kötüdür.
#   3. Kontrol: iki komşu gişe arasındaki kuş uçuşu uzaklık tarifedeki yol km'sinden büyük olmamalı.
#   4. "python -m pytest" kaydın biçimini ve tarifedeki her gişenin burada olduğunu denetler.
#
# İlk kayıt (Kasım 2026): konumlar KGM tarifesindeki sıra ve km'lerle tek tek denetlenerek, gişe
# binaları / kavşaklar üzerinden bir kez belirlendi (kaynak: OpenStreetMap katkıcıları, ODbL).
# Belirlenemeyen 3 gişe null bırakıldı.


